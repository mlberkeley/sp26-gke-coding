apiVersion: batch/v1
kind: Job
metadata:
  name: coding-agent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/intrepid-stage-489905-m7/gke-workflows/coding-agent:latest

          command:
            - sh
            - -c
            - |
              mkdir -p /workspace
              cp /app/sp26_gke/tests/buggy_script.py /workspace/
              cp /app/sp26_gke/tests/test_buggy_script.py /workspace/
              python /app/sp26_gke/workflows/gke_agent_job.py

          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: GOOGLE_API_KEY
            - name: KUBECONFIG
              value: /kubeconfig/config

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: kubeconfig
              mountPath: /kubeconfig
              readOnly: true

      volumes:
        - name: workspace
          emptyDir: {}
        - name: kubeconfig
          configMap:
            name: kubeconfig-cm
