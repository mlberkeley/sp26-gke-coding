apiVersion: batch/v1
kind: Job
metadata:
  name: coding-agent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/intrepid-stage-489905-m7/gke-workflows/coding-agent:latest
          command:
            - python3
            - /app/sp26_gke/workflows/orchestrator_job.py
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: GOOGLE_API_KEY
            - name: KUBECONFIG
              value: /kubeconfig/config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: kubeconfig
              mountPath: /kubeconfig
              readOnly: true
      volumes:
        - name: input
          configMap:
            name: user-code # must be created before applying this Job
        - name: kubeconfig
          configMap:
            name: kubeconfig-cm
